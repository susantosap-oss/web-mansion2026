  .leg-dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; }

    position: fixed; top: 20px; left: 50%; transform: translateX(-50%);

    border: 1px solid #C9A84C44;
    border-radius: 10px;

// ── D3 SETUP ─────────────────────────────────────────────────────────────
const svg  = d3.select("#canvas");
const W = window.innerWidth, H = window.innerHeight;
svg.attr("width", W).attr("height", H);

const g = svg.append("g");

const zoom = d3.zoom()
  .scaleExtent([0.12, 3])
  .on("zoom", e => g.attr("transform", e.transform));
svg.call(zoom);

const tooltip = document.getElementById("tooltip");
const ttTitle  = document.getElementById("tt-title");
const ttBody   = document.getElementById("tt-body");

function showTooltip(event, d) {
  if (!d.data.desc) return;
  ttTitle.textContent = d.data.name.replace(/\n/g, " ");
  ttBody.innerHTML    = d.data.desc.replace(/\n/g, "<br>");
  tooltip.style.opacity = 1;
  moveTooltip(event);
}
function moveTooltip(event) {
  const x = event.clientX + 14, y = event.clientY - 10;
  tooltip.style.left = (x + 300 > W ? x - 315 : x) + "px";
  tooltip.style.top  = (y + 130 > H ? y - 130  : y) + "px";
}
function hideTooltip() { tooltip.style.opacity = 0; }

const RADIUS = Math.min(W, H) * 0.43;

function buildTree() {
  const root   = d3.hierarchy(data);
  root.each(d => { d._children = d.children; if (d.depth > 1) d.children = null; });
  const layout = d3.tree()
    .size([2 * Math.PI, RADIUS])
    .separation((a, b) => (a.parent === b.parent ? 1 : 2) / a.depth);
  return { root, layout };
}

let { root, layout } = buildTree();
layout(root);

const linkGen = d3.linkRadial().angle(d => d.x).radius(d => d.y);

const linkGroup = g.append("g").attr("class", "links");
const nodeGroup = g.append("g").attr("class", "nodes");

svg.call(zoom.transform, d3.zoomIdentity.translate(W / 2, H / 2));

function update() {
  layout(root);

  // links
  const links = linkGroup.selectAll(".link")
    .data(root.links(), d => d.target.data.name + d.target.depth);

  links.enter().append("path")
    .attr("class", "link")
    .attr("stroke", d => d.target.data.color || "#555")
    .attr("d", linkGen)
    .style("opacity", 0)
    .transition().duration(450).style("opacity", 1);

  links.transition().duration(450).attr("d", linkGen);
  links.exit().transition().duration(300).style("opacity", 0).remove();

  // nodes
  const nodes = nodeGroup.selectAll(".node")
    .data(root.descendants(), d => d.data.name + d.depth);

  const r = d => d.depth === 0 ? 38 : d.depth === 1 ? 22 : d.depth === 2 ? 14 : 9;

  const nodeEnter = nodes.enter().append("g")
    .attr("class", d => `node ${d.data.level || "l2"}`)
    .attr("transform", d => `rotate(${d.x * 180 / Math.PI - 90}) translate(${d.y},0)`)
    .style("opacity", 0)
    .on("click", (event, d) => {
      event.stopPropagation();
      if (d._children) { d.children = d._children; d._children = null; }
      else              { d._children = d.children; d.children = null; }
      update();
    })
    .on("mouseover", showTooltip)
    .on("mousemove", moveTooltip)
    .on("mouseout",  hideTooltip);

  nodeEnter.append("circle")
    .attr("r", r)
    .attr("fill",   d => d.data.color || "#333")
    .attr("stroke", d => d3.color(d.data.color || "#333").brighter(0.8));

  nodeEnter.each(function(d) {
    const node   = d3.select(this);
    const angle  = d.x * 180 / Math.PI;
    const flip   = angle > 90 && angle < 270;
    const lines  = d.data.name.split("\n");
    const anchor = d.depth === 0 ? "middle" : flip ? "end" : "start";
    const dx     = d.depth === 0 ? 0 : (flip ? -(r(d) + 6) : (r(d) + 6));

    const text = node.append("text")
      .attr("text-anchor", anchor)
      .attr("transform",   `rotate(${flip && d.depth > 0 ? 180 : 0})`)
      .attr("dy", lines.length > 1 ? "-0.4em" : "0.35em")
      .attr("dx", dx);

    lines.forEach((line, i) => {
      text.append("tspan")
        .attr("x",  dx)
        .attr("dy", i === 0 ? 0 : "1.2em")
        .text(line);
    });
  });

  // collapse dot indicator
  nodeEnter.filter(d => d._children)
    .append("circle")
    .attr("r", 4)
    .attr("cx", d => {
      const flip = d.x * 180 / Math.PI > 90 && d.x * 180 / Math.PI < 270;
      return flip ? -(r(d) - 4) : (r(d) - 4);
    })
    .attr("fill", "#fff").attr("opacity", 0.7);

  nodeEnter.transition().duration(450).style("opacity", 1);

  nodes.transition().duration(450)
    .attr("transform", d => `rotate(${d.x * 180 / Math.PI - 90}) translate(${d.y},0)`)
    .style("opacity", 1);

  nodes.exit().transition().duration(300).style("opacity", 0).remove();
}

update();

function expandAll() {
  root.each(d => { if (d._children) { d.children = d._children; d._children = null; } });
  update();
}
function collapseAll() {
  root.each(d => { if (d.depth > 0 && d.children) { d._children = d.children; d.children = null; } });
  update();
}
function resetView() {
  svg.transition().duration(600)
    .call(zoom.transform, d3.zoomIdentity.translate(W / 2, H / 2));
}

window.addEventListener("resize", () => {
  svg.attr("width", window.innerWidth).attr("height", window.innerHeight);
});
</script>
</body>
